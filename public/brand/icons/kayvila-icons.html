<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kayvila — Pack d'icônes</title>
<style>
:root{--navy:#0b1d2e;--gold:#d4af37;--cream:#f5f0e8;--ink:#0a0a0a;--muted:#8b8b8b;--border:#e5e3db;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--navy);}
header{padding:48px 32px 24px;max-width:1100px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:16px}
.brand svg{width:54px;height:54px;color:var(--navy)}
h1{font-size:26px;margin:0;font-weight:600;letter-spacing:.3px}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 0}
.toolbar button{border:1px solid var(--border);background:#fff;color:var(--navy);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:13px;transition:.2s}
.toolbar button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
main{max-width:1100px;margin:0 auto;padding:8px 32px 64px}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:40px 0 16px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{margin:0;background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px 12px 14px;text-align:center;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(11,29,46,.10)}
.ico{height:64px;display:flex;align-items:center;justify-content:center;color:var(--navy)}
.ico svg{width:40px;height:40px}
figcaption{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.name{font-size:12px;color:var(--navy);font-weight:500}
.lbl{font-size:11px;color:var(--muted)}
body.theme-gold .ico{color:var(--gold)}
body.theme-dark{background:var(--navy);color:#fff}
body.theme-dark .card{background:#10283c;border-color:#1d3a52}
body.theme-dark .ico{color:#fff}
body.theme-dark .name{color:#fff}
body.theme-dark .toolbar button{background:#10283c;color:#fff;border-color:#1d3a52}
body.theme-dark.theme-gold .ico{color:var(--gold)}
</style></head>

const b=document.body, btns=[...document.querySelectorAll('.toolbar button')];
btns.forEach(x=>x.onclick=()=>{
