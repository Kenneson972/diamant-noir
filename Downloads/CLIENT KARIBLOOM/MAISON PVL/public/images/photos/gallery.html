<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie Photos Maison PVL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #eee; padding: 2rem; }
  h1 { font-size: 1.5rem; margin-bottom: 2rem; font-weight: 300; }
  h2 { font-size: 1rem; color: #999; margin: 2rem 0 1rem; font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
  .card { background: #1a1a1a; border-radius: 2px; overflow: hidden; }
  .card img { width: 100%; height: auto; display: block; }
  .card .info { padding: 0.75rem 1rem; font-size: 0.75rem; color: #999; }
  .card .info strong { color: #fff; display: block; margin-bottom: 0.25rem; }
  .tag { display: inline-block; padding: 2px 6px; border-radius: 2px; font-size: 0.625rem; margin-right: 4px; }
  .tag.landscape { background: #1a3a5c; color: #6af; }
  .tag.portrait { background: #3a1a5c; color: #a6f; }
</style>
</head>
<body>
<h1>MAISON PVL — Photos d'illustration (9 fichiers)</h1>

<h2>16:9 — Landscape / Hero / Bannières (4)</h2>
<div class="grid" id="landscape"></div>

<h2>4:5 — Portrait / Produits / Modèles (5)</h2>
<div class="grid" id="portrait"></div>

<script>
const photos = [
  { file: "pour-home-page.png", w: 1672, h: 941, note: "Nommé 'pour home page'" },
  { file: "12-mai-2026-a-12_56_57.png", w: 1672, h: 941, note: "Généré à 12:56" },
  { file: "12-mai-2026-a-17_21_54.png", w: 1672, h: 941, note: "Généré à 17:21" },
  { file: "12-mai-2026-a-17_22_50.png", w: 1672, h: 941, note: "Généré à 17:22" },
  { file: "12-mai-2026-a-17_09_17.png", w: 1122, h: 1402, note: "Généré à 17:09" },
  { file: "12-mai-2026-a-17_16_12.png", w: 1122, h: 1402, note: "Généré à 17:16" },
  { file: "12-mai-2026-a-17_36_55.png", w: 1122, h: 1402, note: "Généré à 17:36" },
  { file: "12-mai-2026-a-17_46_20.png", w: 1122, h: 1402, note: "Généré à 17:46" },
  { file: "12-mai-2026-a-17_49_31.png", w: 1122, h: 1402, note: "Généré à 17:49" },
];
photos.forEach(p => {
  const isLandscape = p.w > p.h;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <img src="/images/photos/${p.file}" alt="${p.file}" loading="lazy" />
    <div class="info">
      <strong>${p.file}</strong>
      ${p.w}×${p.h} · <span class="tag ${isLandscape ? 'landscape' : 'portrait'}">${isLandscape ? '16:9 HERO' : '4:5 PRODUIT'}</span>
      <br>${p.note}
    </div>
  `;
  const target = isLandscape ? 'landscape' : 'portrait';
  document.getElementById(target).appendChild(card);
});
</script>
</body>
</html>
